function scene(n){return '<div class="scene" style="background-position:'+(n%3*50)+'% '+(Math.floor(n/3)*100)+'%" role="img" aria-label="Иллюстрация к истории"></div>'}
$('missions').innerHTML=missions.map((m,i)=>'<article class="card">'+scene(m.scene)+'<div class="copy"><span class="tag">МИССИЯ '+(i+1)+'</span><h2>'+m.title+'</h2><p>'+m.desc+'</p><button onclick="start('+i+')">Начать →</button></div></article>').join('');
let mission,queue,index,attempts,hints,results,student,support,started,locked,tiles,built,phase,pairLeft,pairDone,freeAnswer='';let speechToken=0;
function speak(text){if(!('speechSynthesis'in window))return;const token=++speechToken,s=window.speechSynthesis;s.cancel();const play=()=>{if(token!==speechToken)return;let v=s.getVoices().filter(v=>/^en/i.test(v.lang));let u=new SpeechSynthesisUtterance(text);u.voice=v.find(v=>/female|sonia|samantha|zira|aria|jenny|karen|hazel/i.test(v.name))||v[0]||null;u.lang=u.voice?.lang||'en-GB';u.rate=.82;s.speak(u)};if(s.getVoices().length)play();else{let done=false;let ready=()=>{if(done)return;done=true;s.removeEventListener('voiceschanged',ready);play()};s.addEventListener('voiceschanged',ready);setTimeout(ready,1200)}}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function home(){stopSpeech();$('game').classList.add('hidden');$('home').classList.remove('hidden');scrollTo(0,0)}
function start(n){stopSpeech();mission=missions[n];queue=shuffle(mission.items);index=0;results=[];student=$('name').value.trim()||'Ученик';support=$('support').value==='yes';started=Date.now();freeAnswer='';$('home').classList.add('hidden');$('game').classList.remove('hidden');showReference();scrollTo(0,0)}
function shell(content){$('game').innerHTML='<button onclick="home()">← Все миссии</button><span class="tag">'+mission.title+'</span><div class="stage">'+currentVisual()+'<div>'+content+'</div></div>'}
function round(){attempts=0;hints=0;locked=false;phase='question';built=[];const q=queue[index];shell('<p>Сцена '+(index+1)+' / '+queue.length+'</p><progress max="'+queue.length+'" value="'+index+'"></progress><div class="bubble">'+escapeHTML(q[0])+'</div><p class="small">'+(support?escapeHTML(q[3]):'')+'</p><button onclick="listen()">▶ Послушать</button><div id="task"></div><div id="feedback" class="feedback" role="status">'+(mission.type==='build'?'Собери вопрос из слов.':'Выбери реплику или вещь, которая подходит по смыслу.')+'</div><button id="hint" onclick="hint()">Подсказка</button><button id="next" class="hidden" onclick="next()">Дальше →</button>');if(mission.type==='build'){tiles=shuffle(q[1].split(' ').map((w,i)=>({w,i})));drawTiles()}else choices(shuffle([q[1],...q[2]]),q[1])}
function listen(){const q=queue[index];speak(mission.type==='build'?q[1]:q[0].replace(/^(Mia|Leo): /,''))}
function choices(options,correct){$('task').innerHTML='<div class="options" id="options"></div>';options.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(locked)return;attempts++;if(t===correct){locked=true;speak(correct);results.push({prompt:queue[index][0],answer:correct,attempts,hints});$('feedback').classList.remove('notice');$('feedback').textContent='Great! '+correct;$('next').classList.remove('hidden');$('hint').classList.add('hidden');$('options').querySelectorAll('button').forEach(x=>x.disabled=true)}else{$('feedback').classList.add('notice');$('feedback').textContent='Попробуй ещё. '+queue[index][4];b.disabled=true}};$('options').append(b)})}
function drawTiles(){$('task').innerHTML='<div class="assembled">'+escapeHTML(built.map(t=>t.w).join(' '))+'</div><div class="tiles" id="tiles"></div><button onclick="resetTiles()">Начать фразу заново</button>';tiles.forEach(t=>{let b=document.createElement('button');b.textContent=t.w;b.disabled=built.some(x=>x.i===t.i);b.onclick=()=>{if(locked)return;attempts++;const expected=queue[index][1].split(' ');if(t.w!==expected[built.length]){$('feedback').classList.add('notice');$('feedback').textContent='Посмотри на порядок слов. '+queue[index][4];return}built.push(t);drawTiles();if(built.length===expected.length){phase='answer';$('feedback').textContent='Вопрос готов! Теперь выбери короткий ответ.';speak(queue[index][1]);let correct=queue[index][2];const options=shuffle([correct,...shuffle(['Yes, I am.','No, I’m not.','Yes, they are.','No, they aren’t.','Yes, it is.','No, it isn’t.','Yes, we are.','No, she isn’t.'].filter(x=>x!==correct)).slice(0,2)]);choices(options,correct)}};$('tiles').append(b)})}
function resetTiles(){if(locked)return;built=[];phase='question';drawTiles()}
function hint(){if(locked)return;hints++;stopSpeech();let o=document.createElement('div');o.id='overlay';o.className='overlay';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.innerHTML='<div class="hint-card"><h2>Посмотри и запомни</h2><p>'+escapeHTML(queue[index][4])+'</p><button onclick="closeHint()">Спрятать подсказку</button></div>';$('task').inert=true;document.body.append(o);o.querySelector('button').focus()}

function closeHint(){$('overlay').remove();$('task').inert=false;$('hint').focus()}

function pairs(){pairDone=[];pairLeft=null;attempts=0;hints=0;shell('<h2>Соедини противоположности</h2><p>Выбери слово слева, затем его пару справа.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div id="left"></div><div id="right"></div></div><div class="feedback" id="feedback" role="status">Начни с любого слова слева.</div><button id="next" class="hidden" onclick="reward()">Ценники готовы →</button>');queue.forEach(q=>{let b=document.createElement('button');b.textContent=q[0];b.id='left-'+q[0];b.onclick=()=>{pairLeft=q;showPair(q[0]);speak(q[0]);$('feedback').textContent='Найди противоположность: '+q[0]};$('left').append(b)});shuffle(queue).forEach(q=>{let b=document.createElement('button');b.textContent=q[1];b.onclick=()=>{if(!pairLeft)return;attempts++;if(q===pairLeft){speak(q[0]+'. '+q[1]);$('left-'+q[0]).disabled=true;b.disabled=true;showPair(q[0]);pairDone.push(q);results.push({prompt:q[0],answer:q[1],attempts,hints});attempts=0;pairLeft=null;$('feedback').textContent='Отличная пара!';if(pairDone.length===queue.length)$('next').classList.remove('hidden')}else{$('feedback').classList.add('notice');$('feedback').textContent='Это другая пара. Big — small; long — short; old — new; cool — boring.';hints++}};$('right').append(b)})}
function freeTask(){shell('<h2>Твои любимые вещи</h2><p>Выбери 2–3 вещи, затем напиши несколько предложений.</p><div id="things"></div><textarea id="free" placeholder="My favourite things are … My … is …" aria-label="Текст ученика"></textarea><p class="small">Это творческое задание проверит учитель.</p><button onclick="saveFree()">Готово →</button><div id="feedback" class="feedback" role="status"></div>');['backpack','games console','laptop computer','mobile phone','mountain bike','skateboard'].forEach(w=>{let l=document.createElement('label');l.className='check';l.innerHTML='<input type="checkbox" value="'+w+'">'+w;$('things').append(l)})}
function saveFree(){let selected=[...$('things').querySelectorAll('input:checked')].map(x=>x.value);if(selected.length<2||selected.length>3||!$('free').value.trim()){$('feedback').textContent='Выбери 2–3 вещи и напиши свой текст.';return}freeAnswer='Выбрано: '+selected.join(', ')+'\nТекст: '+$('free').value.trim();reward()}
