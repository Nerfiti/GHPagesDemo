const $=id=>document.getElementById(id),words=['T-shirt','jeans','trainers','cap','hoodie','dress','boots','skirt','shirt','jacket','jumper','trousers','coat','shoes','top','tracksuit'];let queue,i,letters,used,answer,errors,hints,results,student,started,done;function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function speak(t){if(!window.speechSynthesis)return;let s=window.speechSynthesis;s.cancel();let u=new SpeechSynthesisUtterance(t),v=s.getVoices().filter(v=>/^en/i.test(v.lang));u.voice=v.find(v=>/female|sonia|zira|samantha|aria|jenny|karen/i.test(v.name))||v[0]||null;u.lang=u.voice?.lang||'en-GB';u.rate=.8;s.speak(u)}function start(){student=$('name').value.trim()||'Ученик';queue=shuffle(words).slice(0,6);i=0;results=[];started=Date.now();$('intro').classList.add('hidden');$('game').classList.remove('hidden');round()}function round(){answer='';used=[];errors=0;hints=0;done=false;letters=shuffle(queue[i].toLowerCase().replace('-','').split('').map((v,id)=>({v,id})));let n=words.indexOf(queue[i]);$('game').innerHTML='<p>Покупка '+(i+1)+' из 6</p><div class="pic '+(n>=12?'extra':'')+'" style="background-position:'+(n>=12?(n-12)%2*100:n%4*100/3)+'% '+(n>=12?Math.floor((n-12)/2)*100:Math.floor(n/4)*50)+'%" role="img" aria-label="Предмет одежды"></div><div id="answer" class="word"></div><div id="letters"></div><button id="undo" onclick="undo()">Убрать букву</button><button id="hint" onclick="hint()">Подсказка</button><p class="note" id="feedback" role="status">Собери слово из букв.</p><button id="next" class="hidden" onclick="next()">Дальше →</button>';draw()}function draw(){$('answer').textContent=queue[i]==='T-shirt'?(answer?'T'+(answer.length>1?'-'+answer.slice(1):''):'…'):answer||'…';$('letters').innerHTML='';letters.forEach(l=>{let b=document.createElement('button');b.textContent=l.v.toUpperCase();b.disabled=done||used.includes(l.id);b.onclick=()=>{speak(l.v.toUpperCase());used.push(l.id);answer+=l.v;draw();if(answer.length===letters.length){if(answer===queue[i].toLowerCase().replace('-','')){done=true;results.push({word:queue[i],errors,hints});speak(queue[i]);$('feedback').textContent='Great! '+queue[i];$('next').classList.remove('hidden');$('hint').disabled=true;$('undo').disabled=true;draw()}else{errors++;$('feedback').textContent='Попробуй другой порядок букв.'}}};$('letters').append(b)})}function undo(){if(done)return;used.pop();answer=answer.slice(0,-1);draw()}function hint(){hints++;$('game').inert=true;let el=document.createElement('div');el.id='overlay';el.className='overlay';el.innerHTML='<div class="hint"><h2>Посмотри и запомни</h2><h1>'+queue[i]+'</h1><button onclick="closeHint()">Спрятать подсказку</button></div>';document.body.append(el)}function closeHint(){$('overlay').remove();$('game').inert=false}function next(){i++;if(i<6)round();else{let text='Миа · 2.1 · Собери слово\nУченик: '+student+'\nДата: '+new Date().toLocaleString('ru-RU')+'\nЗавершено: 6/6\nВремя: '+Math.round((Date.now()-started)/1000)+' сек.\n\n'+results.map(r=>r.word+' | ошибок: '+r.errors+' | подсказок: '+r.hints).join('\n');$('game').innerHTML='<h2>Покупки собраны!</h2><p>Скачай отчёт и отправь учителю. Если скачивание запрещено платформой, скопируй текст.</p><textarea id="report" readonly aria-label="Отчёт"></textarea><button id="save">Скачать отчёт</button><button onclick="start()">Ещё раз</button>';$('report').value=text;$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Mia-spelling-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}}
